<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 9 — Daily Workouts</title>
<style>
  :root {
    --bg: #0d0d0d; --panel: #161616; --panel-2: #1e1e1e; --line: #2a2a2a;
    --text: #f2f0ea; --muted: #a8a8a4; --accent: #ff6b00;
    --done: #22c55e; --done-bg: rgba(34,197,94,0.10);
    --miss: #ef4444; --miss-bg: rgba(239,68,68,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  .num { font-variant-numeric: tabular-nums; }

  .sticky-top { position:sticky; top:0; z-index:20; background:var(--bg); }
  header { padding:8px 16px 6px; border-bottom:1px solid var(--line); }
  .eyebrow { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:2px; }
  h1 { font-size:19px; margin:0; font-weight:800; letter-spacing:-0.01em; }
  .week-label { font-size:12px; color:var(--text); margin-top:1px; font-weight:800; letter-spacing:0.01em; }
  .subtitle { font-size:12.5px; color:var(--muted); margin-top:1px; font-weight:600; }
  .countdowns { margin-top:4px; font-size:10px; color:var(--muted); line-height:1.4; }
  .countdowns b { color:var(--text); font-weight:700; }

  .tabs { display:flex; padding:5px 16px; gap:4px; border-bottom:1px solid var(--line); background:var(--bg); }
  .tab { flex:1; text-align:center; padding:6px 0 7px; cursor:pointer; font-size:15px; font-weight:800;
    color:var(--muted); border-bottom:3px solid transparent; }
  .tab.active { color:var(--text); border-bottom-color:var(--text); }

  main { padding:8px 16px 24px; max-width:680px; margin:0 auto; }
  .sec-title { font-size:13px; font-weight:800; color:var(--accent); text-transform:uppercase;
    letter-spacing:0.05em; margin:12px 0 5px; }
  .sec-title:first-child { margin-top:3px; }

  .row { background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:7px 9px; margin-bottom:5px; }
  .row.state-done { background:var(--done-bg); border-color:rgba(34,197,94,0.35); }
  .row.state-miss { background:var(--miss-bg); border-color:rgba(239,68,68,0.3); }
  .row-top { display:flex; align-items:center; gap:10px; }
  .ex-info { flex:1; min-width:0; }
  .ex-name { font-size:16px; font-weight:800; line-height:1.25; }
  .run-badge { display:inline-block; background:var(--accent); color:#0d0d0d; font-size:11px; font-weight:800; padding:2px 8px; border-radius:10px; vertical-align:middle; margin-left:4px; }
  .ex-target { font-size:11px; font-weight:600; color:var(--muted); margin-top:2px; }
  .ex-flag { font-size:10.5px; color:var(--text); opacity:0.8; margin-top:3px; line-height:1.3; font-weight:700; }
  .btns { display:flex; gap:5px; flex:0 0 auto; }
  .btn { width:30px; height:28px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
  .btn.yes.active { background:var(--done); border-color:var(--done); color:#06210f; }
  .btn.no.active { background:var(--miss); border-color:var(--miss); color:#2a0505; }

  /* Zone 2 rows — modality selector + two time fields, replaces tick/cross for Zone 2 slots */
  .z2-row.filled { background:var(--done-bg); border-color:rgba(34,197,94,0.35); }
  .z2-modes { display:flex; gap:6px; margin-top:6px; }
  .z2-mode { flex:1; text-align:center; padding:7px 0; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:12px; font-weight:800; cursor:pointer; }
  .z2-mode.active { background:var(--text); border-color:var(--text); color:#0d0d0d; }
  .z2-inputs { display:flex; gap:8px; margin-top:6px; }
  .z2-field { flex:1; }
  .z2-field label { display:block; font-size:9.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:0.04em; margin-bottom:3px; font-weight:700; }
  .z2-input { width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); font-size:15px; font-weight:700; padding:7px 8px; font-family:inherit; }

  .wod-box { background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:9px 10px; font-size:12px; font-weight:600; color:var(--text); opacity:0.9; line-height:1.4; margin-bottom:6px; white-space:pre-line; }

  .pain-row { display:flex; gap:4px; margin-top:6px; }
  .pain-btn { flex:1; min-width:0; height:30px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pain-btn.active { background:var(--text); border-color:var(--text); color:#0d0d0d; }

  textarea.notes { width:100%; min-height:70px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; color:var(--text); font-size:15px; padding:10px; margin-top:6px; font-family:inherit; resize:vertical; }

  .copy-btn { width:100%; padding:12px; border-radius:10px; background:var(--text);
    color:#0d0d0d; border:none; font-size:15px; font-weight:800; cursor:pointer; margin-top:16px; }
  .copy-btn.copied { background:var(--done); color:#06210f; }
  .copy-btn.nonew { background:var(--panel-2); color:var(--muted); border:1px solid var(--line); }
</style>
</head>
<body>
<div class="sticky-top">
  <header>
    <div class="eyebrow">Rob Sawyer · Hyrox Prep</div>
    <h1>Daily Workouts</h1>
    <div class="week-label">Week 9 — 24–30 Aug 2026</div>
    <div class="subtitle" id="weekSubtitle">Monday — Upper Body</div>
    <div class="countdowns">🏁 <b>Hyrox</b> 29 Oct 2026 — 8wk 6d to go<br>🏃 <b>Marathon</b> 25 Apr 2027 — 34wk 2d to go</div>
  </header>
  <div class="tabs" id="tabs"></div>
</div>
<main id="main"></main>
<script>
// item.type "zone2" => modality (bike/run/row) + total time + zone2 time, no screenshot needed.
// item.type omitted (default tick) => normal ✓/✗ row, used for weighted/rep work and the
// screenshot-based Row Intervals / Hyrox WOD sessions.
const DAYS = {
  mon: { label:"Mon", full:"Monday — Upper Body",
    warmup:{n:"Warm-up", type:"zone2", badge:"🏃 RUN", hint:"10min easy run planned — swap to Bike/Row if the foot's not feeling it"},
    workout: [
      {n:"Strict OHP", wt:"30kg", reps:"3×8", f:"MOVED to front of session (Wk9) so it stops getting cut. Deferred twice already (Wk6, Wk8) — third attempt at 30kg. Watch shoulder closely."},
      {n:"Bench Press", wt:"55kg", reps:"4×6"},
      {n:"Dead Hang", reps:"3×20s · BW"},
      {n:"Captain's Chair", reps:"3×25 · BW", f:"Already confirmed at 25×3 on Wed/Sat — Monday's own attempts specifically keep getting cut (Wk6, Wk8), that's what's untested here, not the weight"},
      {n:"Cable Row", wt:"62.5kg", reps:"3×10"},
      {n:"Lat Pulldown", wt:"56.5kg", reps:"3×10"},
      {n:"Pull-Ups", wt:"Green band", reps:"3×max"},
      {n:"Face Pulls", wt:"16.25kg", reps:"3×15"},
      {n:"Core Machine", wt:"65kg", reps:"3×10"},
    ]},
  tue: { label:"Tue", full:"Tuesday — Row Intervals",
    warmup:{n:"Warm-up", type:"zone2", badge:"🏃 RUN + ROW", hint:"10min easy run + 10min row planned before intervals — swap the run for extra row if the foot's not feeling it"},
    wodbox: "10×250m Row / :30 rest\nTarget pace: ~1:50-1:52/500m\nSend Garmin screenshot after — splits/HR/total time logged from that.",
    workout: [{n:"Row Intervals session (screenshot to follow)", reps:"10×250m/:30r"}] },
  wed: { label:"Wed", full:"Wednesday — Lower Body (Back Squat)",
    warmup:{n:"Warm-up", type:"zone2", hint:"~10min target — bike/row, no run (heavy lifting day)"},
    glute: [
      {n:"Clamshells (10kg held at knee)", reps:"3×15 each", f:"Method changed 26 Aug — now holding a 10kg weight against the knee by hand"},
      {n:"Banded Lateral Walk", reps:"3×15 steps · monster walk, no band"},
      {n:"Side Plank", reps:"3×30s each side"},
      {n:"Kettlebell Knee Drive", reps:"3×12 each · start light", f:"Never actually attempted under the new kettlebell method — first real go"},
    ],
    workout: [
      {n:"Cable Straight Leg Raise", wt:"15kg", reps:"3×15 each", f:"Machine only has 5/10/15kg settings — always really been 10kg, previous lower figures were a recording error. Moved to 15kg (top setting) 26 Aug"},
      {n:"Captain's Chair", reps:"3×22 · BW", f:"Still untested — deferred from Wk6"},
      {n:"Hamstring Curl", wt:"42.5kg", reps:"4×10", f:"Stepped up from 40kg — held since Wk5, overdue. Was already hard by the end at 40kg — watch closely"},
      {n:"Back Squat", wt:"40kg", reps:"4×8", f:"Hold — one clean week isn't the two the rule calls for"},
      {n:"Bulgarian Split Squat", reps:"3×10 each · BW", f:"Rep bump from 8 — felt manageable last week. Still bodyweight, DBs from Wk10"},
      {n:"Single-Leg RDL", wt:"4kg DBs", reps:"3×8 each"},
      {n:"Goblet Squat", wt:"25kg", reps:"3×10", f:"Missed both Wed and Sat last week — back on the list"},
    ]},
  thu: { label:"Thu", full:"Thursday — Rest / Flexible Catch-up",
    workout: [{n:"Optional Zone 2 or catch-up on anything missed earlier in the week", type:"zone2", hint:"only if you want it"}] },
  fri: { label:"Fri", full:"Friday — Hyrox WOD",
    warmup:{n:"Warm-up", type:"zone2", hint:"Easy row, no fixed target"},
    wodbox: "Full WOD, ×2 rounds:\nRow 1km → Wall Balls ×20 (6kg) → Run 5min (7.5km/h, pace held Wk9) → Wall Balls ×20 → Ski 1km → Wall Balls ×20\n30s rest between every station.\nSend Garmin screenshot after — splits/HR/total time logged from that.",
    workout: [{n:"Full WOD session (screenshot to follow)", reps:"6 rounds, 6kg wall ball, 7.5km/h run — pace held this week"}] },
  sat: { label:"Sat", full:"Saturday — Lower Body (Leg Press)",
    warmup:{n:"Warm-up", type:"zone2", hint:"~10min target — bike/row, no run (heavy lifting day)"},
    glute: [
      {n:"Clamshells (10kg held at knee)", reps:"3×15 each", f:"Method changed 26 Aug — now holding a 10kg weight against the knee by hand. Missed twice running last week under the old method — worth a check on why it keeps slipping"},
      {n:"Banded Lateral Walk", reps:"3×15 steps · monster walk, no band"},
      {n:"Side Plank", reps:"3×30s each side"},
      {n:"Kettlebell Knee Drive", reps:"3×12 each · start light", f:"Never actually attempted under the new kettlebell method — first real go"},
    ],
    workout: [
      {n:"Cable Straight Leg Raise", wt:"15kg", reps:"3×15 each", f:"Machine only has 5/10/15kg settings — always really been 10kg, previous lower figures were a recording error. Moved to 15kg (top setting) 26 Aug"},
      {n:"Captain's Chair", reps:"3×25 · BW", f:"Stepped up from 22×3, confirmed clean last week"},
      {n:"Leg Press", wt:"105kg", reps:"4×12", f:"Stepped up from 100kg — held since Wk5, overdue"},
      {n:"Hamstring Curl", wt:"42.5kg", reps:"4×10", f:"Matches Wednesday's step"},
      {n:"Hip Thrust", wt:"45kg", reps:"4×12", f:"The owed attempt, finally — deferred since Wk6. Drop back to 40kg if it's a genuine grind, not just hard-but-clean"},
      {n:"Single-Leg RDL", wt:"4kg DBs", reps:"3×8 each", f:"Missed last Saturday — back on the list"},
      {n:"Goblet Squat", wt:"25kg", reps:"3×10", f:"Missed both Wed and Sat last week — back on the list"},
    ]},
  sun: { label:"Sun", full:"Sunday — Long Zone 2 + Running Return",
    warmup:{n:"Warm-up", type:"zone2", badge:"🏃 RUN", hint:"10min easy run planned before the row (additive, not a swap) — skip it and go straight to the row if the foot's not feeling it"},
    wodbox: "Long Zone 2 row\nTarget: 80 min (raised from 78min actual last week)\n110-139 BPM\nRUNNING GATE: pain ≤2/10 the morning after, or remaining runs this week stop.",
    workout: [{n:"Long Zone 2 row session", type:"zone2", hint:"80min target"}] },
};
const PHYSIO = [
  {n:"Feet Elevated Bridge", reps:"3×60s"},
  {n:"Toe Stretch", reps:"2×60s"},
  {n:"Forward Step Drill", reps:"30 each foot"},
  {n:"High Knee Swaps", reps:"2×60s continuous"},
];
const PM_ITEMS = [
  {n:"Towel Scrunches", reps:"3×20"},
  {n:"Toe Spreading + Extension", reps:"2×15"},
  {n:"Eccentric Heel Drops", reps:"3×15 · BW"},
  {n:"Ankle Hops", reps:"3×15"},
  {n:"Farmer's Walk on Toes", reps:"3×20m · BW"},
];
const DAY_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
let state = {};
let copied = {};
let activeDay = "mon";
const STORE_KEY = "checklist_v11_state";
const COPIED_KEY = "checklist_v11_copied";

function loadState() {
  try { const r = localStorage.getItem(STORE_KEY); state = r ? JSON.parse(r) : {}; } catch(e) { state = {}; }
  try { const r2 = localStorage.getItem(COPIED_KEY); copied = r2 ? JSON.parse(r2) : {}; } catch(e) { copied = {}; }
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function saveCopied() { try { localStorage.setItem(COPIED_KEY, JSON.stringify(copied)); } catch(e){} }

function k(day, section, idx) { return `${day}_${section}_${idx}`; }

// Tick/cross items
function get(key) { return state[key] || { status:null }; }
function setStatus(key, status) {
  const cur = get(key); cur.status = (cur.status===status) ? null : status; state[key]=cur; saveState();
}
// Zone 2 items
function getZone2(key) { return state[key] || { mode:null, total:"", z2:"" }; }
function setZone2Mode(key, mode) {
  const cur = getZone2(key); cur.mode = (cur.mode===mode) ? null : mode; state[key]=cur; saveState();
}
function setZone2Field(key, field, val) {
  const cur = getZone2(key); cur[field] = val; state[key]=cur; saveState();
}

function getNote(day) { return state[`${day}_notes`] || ""; }
function setNote(day, val) { state[`${day}_notes`] = val; saveState(); }
function getPain(day) { return state[`${day}_pain`] || null; }
function setPain(day, val) {
  const cur = getPain(day); state[`${day}_pain`] = (cur===val) ? null : val; saveState();
}

function exRow(item, key) {
  const st = get(key);
  const cls = st.status==='yes' ? ' state-done' : st.status==='no' ? ' state-miss' : '';
  const nameLine = item.wt ? `${item.n}, ${item.wt}` : item.n;
  return `<div class="row${cls}"><div class="row-top">
    <div class="ex-info"><div class="ex-name">${nameLine}</div><div class="ex-target num">${item.reps}</div>
    ${item.f?`<div class="ex-flag">⚑ ${item.f}</div>`:''}</div>
    <div class="btns">
      <div class="btn yes ${st.status==='yes'?'active':''}" data-key="${key}" data-status="yes">✓</div>
      <div class="btn no ${st.status==='no'?'active':''}" data-key="${key}" data-status="no">✗</div>
    </div></div></div>`;
}

function zone2Row(item, key) {
  const z = getZone2(key);
  const filled = z.mode || z.total || z.z2;
  return `<div class="row z2-row${filled?' filled':''}">
    <div class="ex-name">${item.n}${item.badge?` <span class="run-badge">${item.badge}</span>`:''}</div>
    ${item.hint?`<div class="ex-target">${item.hint}</div>`:''}
    <div class="z2-modes">
      <div class="z2-mode ${z.mode==='bike'?'active':''}" data-key="${key}" data-mode="bike">Bike</div>
      <div class="z2-mode ${z.mode==='run'?'active':''}" data-key="${key}" data-mode="run">Run</div>
      <div class="z2-mode ${z.mode==='row'?'active':''}" data-key="${key}" data-mode="row">Row</div>
    </div>
    <div class="z2-inputs">
      <div class="z2-field"><label>Total time (min)</label><input type="number" inputmode="numeric" class="z2-input" data-key="${key}" data-field="total" value="${z.total}"></div>
      <div class="z2-field"><label>Zone 2 time (min)</label><input type="number" inputmode="numeric" class="z2-input" data-key="${key}" data-field="z2" value="${z.z2}"></div>
    </div>
  </div>`;
}

function rowFor(item, key) {
  return item.type === 'zone2' ? zone2Row(item, key) : exRow(item, key);
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = DAY_ORDER.map(d => `<div class="tab ${d===activeDay?'active':''}" data-day="${d}">${DAYS[d].label[0]}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeDay = t.dataset.day; render(); });
}

function renderDay() {
  const d = DAYS[activeDay];
  document.getElementById("weekSubtitle").textContent = d.full;
  let h = '';
  h += `<div class="sec-title">AM Rehab</div>`;
  PHYSIO.forEach((item,i) => h += exRow(item, k(activeDay,'physio',i)));
  if (d.glute) { h += `<div class="sec-title">Glute Activation</div>`;
    d.glute.forEach((item,i) => h += exRow(item, k(activeDay,'glute',i))); }
  h += `<div class="sec-title">Workout</div>`;
  if (d.warmup) h += rowFor(d.warmup, k(activeDay,'warmup',0));
  if (d.wodbox) h += `<div class="wod-box">${d.wodbox}</div>`;
  d.workout.forEach((item,i) => h += rowFor(item, k(activeDay,'workout',i)));
  h += zone2Row({n:"Zone 2 (AM)", hint:"post-weights / morning"}, k(activeDay,'z2am',0));
  h += `<div class="sec-title">PM Rehab</div>`;
  PM_ITEMS.forEach((item,i) => h += exRow(item, k(activeDay,'pm',i)));
  h += zone2Row({n:"Zone 2 (PM)", hint:"evening catch-up"}, k(activeDay,'z2pm',0));
  h += `<div class="sec-title">Foot Pain</div>`;
  const pain = getPain(activeDay);
  h += `<div class="pain-row">` + [...Array(10).keys()].map(n=>n+1).map(n =>
    `<div class="pain-btn ${pain===n?'active':''}" data-pain="${n}">${n}</div>`).join('') + `</div>`;
  h += `<div class="sec-title">Notes</div>`;
  h += `<textarea class="notes" id="notesBox" placeholder="Weight changes, issues, anything...">${getNote(activeDay)}</textarea>`;
  h += `<button class="copy-btn" id="copyBtn">Copy Update</button>`;
  document.getElementById("main").innerHTML = h;

  document.querySelectorAll('.btn').forEach(b => b.onclick = () => { setStatus(b.dataset.key, b.dataset.status); render(); });
  document.querySelectorAll('.z2-mode').forEach(b => b.onclick = () => { setZone2Mode(b.dataset.key, b.dataset.mode); render(); });
  document.querySelectorAll('.z2-input').forEach(inp => {
    inp.oninput = (e) => setZone2Field(inp.dataset.key, inp.dataset.field, e.target.value);
    inp.onblur = () => render();
  });
  document.querySelectorAll('.pain-btn').forEach(b => b.onclick = () => { setPain(activeDay, parseInt(b.dataset.pain)); render(); });
  document.getElementById('notesBox').oninput = (e) => setNote(activeDay, e.target.value);
  document.getElementById('copyBtn').addEventListener('click', onCopyClick);
}

function render() { renderTabs(); renderDay(); }

function allKeysForDay(day) {
  const d = DAYS[day];
  const keys = [];
  PHYSIO.forEach((item,i) => keys.push([k(day,'physio',i), `AM Rehab: ${item.n}`, 'tick']));
  if (d.glute) d.glute.forEach((item,i) => keys.push([k(day,'glute',i), `Glute Activation: ${item.n}`, 'tick']));
  if (d.warmup) keys.push([k(day,'warmup',0), `Warm-up`, d.warmup.type==='zone2'?'zone2':'tick']);
  d.workout.forEach((item,i) => keys.push([k(day,'workout',i), `Workout: ${item.n}`, item.type==='zone2'?'zone2':'tick']));
  keys.push([k(day,'z2am',0), `Zone 2 (AM)`, 'zone2']);
  PM_ITEMS.forEach((item,i) => keys.push([k(day,'pm',i), `PM Rehab: ${item.n}`, 'tick']));
  keys.push([k(day,'z2pm',0), `Zone 2 (PM)`, 'zone2']);
  return keys;
}

function buildDelta(day) {
  const lines = [];
  const already = copied[day] || { keys:[], notes:"", pain:null };
  const newKeys = [];
  allKeysForDay(day).forEach(([key,label,type]) => {
    if (already.keys.includes(key)) return;
    if (type === 'zone2') {
      const z = getZone2(key);
      if (!z.mode && !z.total && !z.z2) return;
      const modeLabel = z.mode ? (z.mode.charAt(0).toUpperCase()+z.mode.slice(1)) : '?';
      lines.push(`${label}: ${modeLabel} · Total ${z.total||'?'}min · Zone 2 ${z.z2||'?'}min`);
      newKeys.push(key);
    } else {
      const st = get(key);
      if (!st.status) return;
      lines.push(`${label}: ${st.status==='yes'?'✓':'✗'}`);
      newKeys.push(key);
    }
  });
  const note = getNote(day);
  const pain = getPain(day);
  let extra = [];
  if (note && note !== already.notes) extra.push(`Notes: ${note}`);
  if (pain !== null && pain !== already.pain) extra.push(`Foot Pain: ${pain}/10`);
  const text = [...lines, ...extra].join('\n');
  return { text, newKeys, note, pain };
}

async function onCopyClick() {
  const { text, newKeys, note, pain } = buildDelta(activeDay);
  const btn = document.getElementById("copyBtn");
  if (!text) {
    btn.textContent = "Nothing new to copy"; btn.classList.add("nonew");
    setTimeout(() => { btn.textContent="Copy Update"; btn.classList.remove("nonew"); }, 1500);
    return;
  }
  const full = `${DAYS[activeDay].full}\n${text}`;
  try { await navigator.clipboard.writeText(full); }
  catch(e) { const ta=document.createElement('textarea'); ta.value=full; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  const prev = copied[activeDay] || { keys:[], notes:"", pain:null };
  copied[activeDay] = { keys: [...prev.keys, ...newKeys], notes: note, pain: pain };
  saveCopied();
  btn.textContent = "Copied ✓"; btn.classList.add("copied");
  setTimeout(() => { btn.textContent="Copy Update"; btn.classList.remove("copied"); }, 2000);
}

loadState(); render();
</script>
</body>
</html>
