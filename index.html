<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Marathon Week 4 — Daily Workouts</title>
<style>
  :root {
    --bg: #0d0d0d; --panel: #161616; --panel-2: #1e1e1e; --line: #2a2a2a;
    --text: #f2f0ea; --muted: #a8a8a4; --accent: #ff6b00;
    --done: #22c55e; --done-bg: rgba(34,197,94,0.10);
    --miss: #ef4444; --miss-bg: rgba(239,68,68,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  .num { font-variant-numeric: tabular-nums; }

  .sticky-top { position:sticky; top:0; z-index:20; background:var(--bg); }
  header { padding:8px 16px 6px; border-bottom:1px solid var(--line); }
  .eyebrow { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:2px; }
  h1 { font-size:19px; margin:0; font-weight:800; letter-spacing:-0.01em; }
  .week-label { font-size:12px; color:var(--text); margin-top:1px; font-weight:800; letter-spacing:0.01em; }
  .subtitle { font-size:12.5px; color:var(--muted); margin-top:1px; font-weight:600; }
  .countdowns { margin-top:4px; font-size:10px; color:var(--muted); line-height:1.4; }
  .countdowns b { color:var(--text); font-weight:700; }

  .tabs { display:flex; padding:5px 16px; gap:4px; border-bottom:1px solid var(--line); background:var(--bg); }
  .tab { flex:1; text-align:center; padding:6px 0 7px; cursor:pointer; font-size:15px; font-weight:800;
    color:var(--muted); border-bottom:3px solid transparent; }
  .tab.active { color:var(--text); border-bottom-color:var(--text); }

  main { padding:8px 16px 24px; max-width:680px; margin:0 auto; }
  .sec-title { font-size:13px; font-weight:800; color:var(--accent); text-transform:uppercase;
    letter-spacing:0.05em; margin:12px 0 5px; }
  .sec-title:first-child { margin-top:3px; }

  .row { background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:7px 9px; margin-bottom:5px; }
  .row.state-done { background:var(--done-bg); border-color:rgba(34,197,94,0.35); }
  .row.state-miss { background:var(--miss-bg); border-color:rgba(239,68,68,0.3); }
  .row-top { display:flex; align-items:center; gap:8px; }
  .ex-info { flex:1; min-width:0; }
  .ex-name { font-size:16px; font-weight:800; line-height:1.25; }
  .run-badge { display:inline-block; background:var(--accent); color:#0d0d0d; font-size:11px; font-weight:800; padding:2px 8px; border-radius:10px; vertical-align:middle; margin-left:4px; }
  .ex-target { font-size:11px; font-weight:600; color:var(--muted); margin-top:2px; }
  .ex-flag { font-size:10.5px; color:var(--text); opacity:0.8; margin-top:3px; line-height:1.3; font-weight:700; }
  .btns { display:flex; gap:5px; flex:0 0 auto; align-items:center; }
  .btn { width:30px; height:28px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
  .btn.yes.active { background:var(--done); border-color:var(--done); color:#06210f; }
  .btn.no.active { background:var(--miss); border-color:var(--miss); color:#2a0505; }
  .btn.note-toggle { font-size:14px; font-weight:800; color:var(--muted); }
  .btn.note-toggle.has-note { background:var(--accent); border-color:var(--accent); color:#2a1400; }

  .note-input-wrap { margin-top:7px; }
  input.note-input { width:100%; background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; color:var(--text); font-size:14px; padding:8px 10px; font-family:inherit; }
  input.note-input::placeholder { color:var(--muted); }

  /* Zone 2 AM/PM rows — modality tick only, no manual time entry. Claude pulls real
     duration and zone-time from Garmin and writes it into the Card directly. */
  .z2-row.filled { background:var(--done-bg); border-color:rgba(34,197,94,0.35); }
  .z2-modes { display:flex; gap:6px; margin-top:6px; }
  .z2-mode { flex:1; text-align:center; padding:7px 0; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:12px; font-weight:800; cursor:pointer; }
  .z2-mode.active { background:var(--text); border-color:var(--text); color:#0d0d0d; }

  .wod-box { background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:9px 10px; font-size:12px; font-weight:600; color:var(--text); opacity:0.9; line-height:1.4; margin-bottom:6px; white-space:pre-line; }

  .pain-row { display:flex; gap:4px; margin-top:6px; }
  .pain-btn { flex:1; min-width:0; height:30px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pain-btn.active { background:var(--text); border-color:var(--text); color:#0d0d0d; }

  .copy-btn { width:100%; padding:12px; border-radius:10px; background:var(--text);
    color:#0d0d0d; border:none; font-size:15px; font-weight:800; cursor:pointer; margin-top:16px; }
  .copy-btn.copied { background:var(--done); color:#06210f; }
  .copy-btn.nonew { background:var(--panel-2); color:var(--muted); border:1px solid var(--line); }
</style>
</head>
<body>
<div class="sticky-top">
  <header>
    <div class="eyebrow">Rob Sawyer · Marathon Prep</div>
    <h1>Daily Workouts</h1>
    <div class="week-label">Marathon Week 4 of 34 — 21–27 Sep 2026</div>
    <div class="subtitle" id="weekSubtitle">Monday — Upper Body</div>
    <div class="countdowns">🏃 <b>London Marathon</b> 25 Apr 2027 — 32wk to go</div>
  </header>
  <div class="tabs" id="tabs"></div>
</div>
<main id="main"></main>
<script>
// item.type "zone2" => modality (bike/run/row) picker, used ONLY for Zone 2 AM/PM boxes where the
// modality genuinely varies session to session. Everything else (warm-up, cool-down, workout,
// rehab) is a fixed-modality tick row — the modality is named in the title itself (e.g. "Run",
// "Row"), so when the plan changes, amend the title/hint text here rather than the component.
//
// RESTRUCTURED 14 Sep 2026: warm-up and cool-down are now arrays, one box per modality, instead of
// a single combined box — e.g. Tuesday's warm-up is [Run, Row] as two separate ticks, not one box
// covering both. This makes future changes (a warm-up piece added/dropped/renamed) a one-line edit
// to the relevant day's array, not a restructure of the render logic.
const DAYS = {
  mon: { label:"Mon", full:"Monday — Upper Body (rebuilt: posture + push/pull spacing)",
    warmup: [
      {n:"Bike", reps:"10min easy"},
    ],
    workout: [
      {n:"Chin Tucks", wt:"BW", reps:"3×10 (5s hold)", f:"Rest 20s. NEW 3 Sep 2026 — deep neck flexor strength for forward head posture."},
      {n:"Cable Row", wt:"65kg", reps:"3×10", f:"Rest 100s. HOLD — bumped from 62.5kg 14 Sep 2026."},
      {n:"Strict OHP", wt:"30kg", reps:"3×8", f:"Rest 100s. Goes before Bench deliberately — harder, more shoulder-sensitive lift done while freshest. Watch shoulder closely."},
      {n:"Lat Pulldown", wt:"56.5kg", reps:"3×10", f:"Rest 100s. HOLD."},
      {n:"Bench Press", wt:"55kg", reps:"4×6", f:"Rest 100s. Bumped from 50kg 14 Sep 2026 — resuming a previous working weight, not a fresh PB push."},
      {n:"Pull-Ups", wt:"Green band", reps:"3×max", f:"Rest 90s. HOLD."},
      {n:"Incline DB Press", wt:"TBD — first attempt", reps:"3×10", f:"Rest 90s. NEW 3 Sep 2026, alongside Bench not instead of it — upper chest angle, less anterior shoulder stress, matches the definition goal."},
      {n:"Face Pulls", wt:"16.25kg", reps:"3×15", f:"Rest 60s. HOLD."},
      {n:"Cable External Rotation", wt:"TBD — first attempt", reps:"3×12 each", f:"Rest 45s. NEW 3 Sep 2026 — same cable column as Face Pulls, no band. Targets external rotator cuff specifically, protective given the OHP shoulder history."},
      {n:"Core Machine", wt:"65kg", reps:"3×10", f:"Rest 60s. HOLD."},
      {n:"Dead Hang", wt:"BW", reps:"3×20s", f:"Rest 60s. HOLD."},
    ]},
  tue: { label:"Tue", full:"Tuesday — Norwegian 4×4 (swap to easy Zone 2 row if HRV still down)",
    warmup: [
      {n:"Run", reps:"10min easy"},
      {n:"Row", reps:"10min easy"},
    ],
    wodbox: "NEW FORMAT — Norwegian 4×4: 4 reps of 4min hard / 3min easy.\nHard-rep HR target: 166-175bpm, from rep 1 (not a feel-it-out ramp).\nRecovery = light steady row, NOT near-stationary.\nDistance tracked via Concept2 on the 4 hard reps only — recovery periods aren't logged.\nReplaces 10×250m intervals — that format is retired.",
    workout: [
      {n:"Norwegian 4×4 session (Concept2/Garmin data to follow)", reps:"4×(4min hard/3min easy)"},
    ],
    cooldown: [
      {n:"Bike", reps:"10min — needed, wired after hard intervals"},
    ] },
  wed: { label:"Wed", full:"Wednesday — Lower Body (Quad/Squat)",
    warmup: [
      {n:"Bike or Row", reps:"~10min — no run, heavy lifting day"},
    ],
    glute: [
      {n:"Clamshells (10kg held at knee)", reps:"3×15 each", f:"Rest 40s"},
      {n:"Banded Lateral Walk", reps:"3×15 steps · monster walk, no band", f:"Rest 40s"},
      {n:"Side Plank", reps:"3×30s each side", f:"Rest 45s"},
    ],
    workout: [
      {n:"Cable Straight Leg Raise", wt:"15kg", reps:"3×15 each", f:"Rest 60s. CORRECTED 20 Sep 2026 — machine goes higher than 15kg, this was never the equipment ceiling; holding here because it genuinely feels maximal for Rob right now, same as Lying Cable Knee Drive."},
      {n:"Lying Cable Knee Drive", wt:"20kg", reps:"3×15 each", f:"Rest 60s. Bumped from 15kg Wed 16 Sep 2026, Rob's call, new standard."},
      {n:"Goblet Squat", wt:"26kg", reps:"4×10", f:"Rest 100s. Bumped from 25kg Wed 16 Sep 2026, Rob's call, new standard."},
      {n:"Bulgarian Split Squat", wt:"6kg DBs", reps:"3×10 each", f:"Rest 60s. Bumped from 4kg Sat 19 Sep 2026, Rob's call — \"brutal\" but keeping it, new standard. Applies to both Wed and Sat."},
      {n:"Hamstring Curl", wt:"40kg", reps:"4×10", f:"Rest 60s. HOLD."},
      {n:"Captain's Chair", wt:"BW", reps:"3×25", f:"Rest 50s. Moved to last 3 Sep 2026 — core after compound lifts, not before."},
    ]},
  thu: { label:"Thu", full:"Thursday — Full Rest",
    workout: [{n:"Full rest day — physio only, no gym", reps:"nothing else planned"}] },
  fri: { label:"Fri", full:"Friday — WOD (NEW: KB Swings + Bike)",
    warmup: [
      {n:"Row", reps:"10min easy, no fixed target"},
    ],
    wodbox: "Row 1000m → 25× 16kg KB Swings → Run 5min (7.5km/h) → 25× 16kg KB Swings → Bike 60cal → 25× 16kg KB Swings. Repeat once. Never trust Garmin's auto-detected KB Swing rep count — always 25.",
    workout: [
      {n:"Full WOD session", reps:"2 rounds: Row 1k, KB, Run 5min, KB, Bike 60cal, KB"},
    ],
    cooldown: [
      {n:"Bike", reps:"10min — needed, wired after WOD"},
    ] },
  sat: { label:"Sat", full:"Saturday — Lower Body (Posterior Chain/Hip Hinge)",
    warmup: [
      {n:"Bike or Row", reps:"~10min — no run, heavy lifting day"},
    ],
    glute: [
      {n:"Clamshells (10kg held at knee)", reps:"3×15 each", f:"Rest 40s"},
      {n:"Banded Lateral Walk", reps:"3×15 steps · monster walk, no band", f:"Rest 40s"},
      {n:"Side Plank", reps:"3×30s each side", f:"Rest 45s"},
    ],
    workout: [
      {n:"Cable Straight Leg Raise", wt:"15kg", reps:"3×15 each", f:"Rest 60s."},
      {n:"Lying Cable Knee Drive", wt:"20kg", reps:"3×15 each", f:"Rest 60s. Bumped from 15kg Wed 16 Sep 2026, carried to Saturday, Rob's call, new standard."},
      {n:"Leg Press", wt:"100kg", reps:"4×12", f:"Rest 100s. HOLD — 105kg PB chase dropped 3 Sep 2026, not owed any more."},
      {n:"Hip Thrust", wt:"40kg", reps:"4×12", f:"Rest 100s. HOLD — 45kg PB chase dropped 3 Sep 2026, not owed any more."},
      {n:"Hamstring Curl", wt:"40kg", reps:"4×10", f:"Rest 60s. HOLD."},
      {n:"Single-Leg RDL", wt:"4kg DBs", reps:"3×8 each", f:"Rest 60s. HOLD."},
      {n:"Bulgarian Split Squat", wt:"6kg DBs", reps:"3×10 each", f:"Rest 60s. Bumped from 4kg Sat 19 Sep 2026, Rob's call — \"brutal\" but keeping it, new standard. Applies to both Wed and Sat."},
      {n:"Single-Leg Calf Raise", wt:"BW to start", reps:"3×15 each", f:"Rest 60s. NEW 3 Sep 2026 — brought forward given live calf/ankle weakness concerns."},
      {n:"Captain's Chair", wt:"BW", reps:"3×25", f:"Rest 50s. Moved to last 3 Sep 2026 — core after compound lifts, not before."},
    ]},
  sun: { label:"Sun", full:"Sunday — Run + Row (NEW structure)",
    warmup: [
      {n:"Run", reps:"45min, fresh legs, Zone 2 — self-directed, 5-10min jumps based on feel, before the row"},
    ],
    wodbox: "STRUCTURE (agreed 30 Aug 2026, run target bumped to 45min 20 Sep 2026) — 45min run (fresh legs, Zone 2) then 60min row.\nRow holds at 60min — didn't happen at all in Week 3, held again rather than pushed toward 75-90min yet.\nRUNNING GATE: pain ≤2/10 the morning after, or remaining runs that week stop.",
    workout: [
      {n:"Row (after run)", reps:"60min, Concept2, Zone 2"},
    ] },
};
const PHYSIO = [
  {n:"Feet Elevated Bridge", reps:"3×60s"},
  {n:"Toe Stretch", reps:"2×60s"},
  {n:"Forward Step Drill", reps:"30 each foot"},
  {n:"High Knee Swaps", reps:"2×60s continuous"},
];
const PM_ITEMS = [
  {n:"Towel Scrunches", reps:"3×20"},
  {n:"Toe Spreading + Extension", reps:"2×15"},
  {n:"Eccentric Heel Drops", reps:"3×15 · BW"},
  {n:"Ankle Hops", reps:"3×15"},
  {n:"Farmer's Walk on Toes", reps:"3×20m · BW"},
];
const DAY_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
let state = {};
let copied = {};
let activeDay = "mon";
let openNotes = {}; // which note inputs are currently expanded, session-only, not persisted

// STORAGE KEY INCLUDES THE WEEK NUMBER — this is the actual fix for the "doesn't clear between
// weeks" bug. Each new week's file uses a new key, so last week's ticks/notes simply aren't found
// under it — the page starts blank automatically, with no clearing logic needed. STANDING RULE:
// bump the week number here every time this file is rebuilt for a new week, or this fix silently
// stops working.
const STORE_KEY = "checklist_wk4_v28_state";
const COPIED_KEY = "checklist_wk4_v28_copied";

function loadState() {
  try { const r = localStorage.getItem(STORE_KEY); state = r ? JSON.parse(r) : {}; } catch(e) { state = {}; }
  try { const r2 = localStorage.getItem(COPIED_KEY); copied = r2 ? JSON.parse(r2) : {}; } catch(e) { copied = {}; }
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function saveCopied() { try { localStorage.setItem(COPIED_KEY, JSON.stringify(copied)); } catch(e){} }

function k(day, section, idx) { return `${day}_${section}_${idx}`; }

// Tick/cross items
function get(key) { return state[key] || { status:null, note:"" }; }
function setStatus(key, status) {
  const cur = get(key); cur.status = (cur.status===status) ? null : status; state[key]=cur; saveState();
}
function setItemNote(key, val) {
  const cur = get(key); cur.note = val; state[key] = cur; saveState();
}
// Zone 2 AM/PM items — modality (bike/run/row) picker IS the tick — Claude pulls the real duration
// and zone-time from Garmin afterward and writes it into the Card. The checklist's only job is
// telling Claude what to look for, not recording numbers by hand.
function getZone2(key) { return state[key] || { mode:null, note:"", status:null }; }
function setZone2Mode(key, mode) {
  const cur = getZone2(key); cur.mode = (cur.mode===mode) ? null : mode; state[key]=cur; saveState();
}
function setZone2Status(key, status) {
  const cur = getZone2(key); cur.status = (cur.status===status) ? null : status; state[key]=cur; saveState();
}

function getPain(day) { return state[`${day}_pain`] || null; }
function setPain(day, val) {
  const cur = getPain(day); state[`${day}_pain`] = (cur===val) ? null : val; saveState();
}

// Steps — full-day Apple Health total, entered once the day is actually finished (same page as
// Foot Pain, same reasoning: both describe THIS page's day, filled in once it's over, not the day
// the numbers happen to be typed in). Free-text number, not a button grid — no upper bound on steps.
function getSteps(day) { const v = state[`${day}_steps`]; return (v===undefined || v===null || v==='') ? null : v; }
function setSteps(day, val) {
  state[`${day}_steps`] = (val===''||val===null||val===undefined) ? null : val; saveState();
}

function noteBtn(key, note) {
  return `<div class="btn note-toggle${note?' has-note':''}" data-notekey="${key}">?</div>`;
}
function noteInputHtml(key, note, kind) {
  if (!openNotes[key]) return '';
  return `<div class="note-input-wrap"><input class="note-input" type="text" data-noteinput="${key}" data-notekind="${kind}"
    placeholder="Amendment for this exercise..." value="${(note||'').replace(/"/g,'&quot;')}"></div>`;
}

function exRow(item, key) {
  const st = get(key);
  const cls = st.status==='yes' ? ' state-done' : st.status==='no' ? ' state-miss' : '';
  const nameLine = item.wt ? `${item.n}, ${item.wt}` : item.n;
  return `<div class="row${cls}"><div class="row-top">
    <div class="ex-info"><div class="ex-name">${nameLine}</div><div class="ex-target num">${item.reps||''}</div>
    ${item.f?`<div class="ex-flag">⚑ ${item.f}</div>`:''}</div>
    <div class="btns">
      <div class="btn yes ${st.status==='yes'?'active':''}" data-key="${key}" data-status="yes">✓</div>
      <div class="btn no ${st.status==='no'?'active':''}" data-key="${key}" data-status="no">✗</div>
      ${noteBtn(key, st.note)}
    </div></div>
    ${noteInputHtml(key, st.note, 'tick')}
  </div>`;
}

function zone2Row(item, key) {
  const z = getZone2(key);
  const cls = z.status==='yes' ? ' state-done' : z.status==='no' ? ' state-miss' : '';
  return `<div class="row z2-row${z.mode?' filled':''}${cls}">
    <div class="row-top"><div class="ex-info">
      <div class="ex-name">${item.n}${item.badge?` <span class="run-badge">${item.badge}</span>`:''}</div>
      ${item.hint?`<div class="ex-target">${item.hint}</div>`:''}
    </div>
    <div class="btns">
      <div class="btn yes ${z.status==='yes'?'active':''}" data-statuskey="${key}" data-zstatus="yes">✓</div>
      <div class="btn no ${z.status==='no'?'active':''}" data-statuskey="${key}" data-zstatus="no">✗</div>
      ${noteBtn(key, z.note)}
    </div></div>
    <div class="z2-modes">
      <div class="z2-mode ${z.mode==='bike'?'active':''}" data-key="${key}" data-mode="bike">Bike</div>
      <div class="z2-mode ${z.mode==='run'?'active':''}" data-key="${key}" data-mode="run">Run</div>
      <div class="z2-mode ${z.mode==='row'?'active':''}" data-key="${key}" data-mode="row">Row</div>
    </div>
    ${noteInputHtml(key, z.note, 'zone2')}
  </div>`;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = DAY_ORDER.map(d => `<div class="tab ${d===activeDay?'active':''}" data-day="${d}">${DAYS[d].label[0]}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeDay = t.dataset.day; openNotes = {}; render(); });
}

function renderDay() {
  const d = DAYS[activeDay];
  document.getElementById("weekSubtitle").textContent = d.full;
  let h = '';
  h += `<div class="sec-title">AM Rehab</div>`;
  PHYSIO.forEach((item,i) => h += exRow(item, k(activeDay,'physio',i)));
  if (d.glute) { h += `<div class="sec-title">Glute Activation</div>`;
    d.glute.forEach((item,i) => h += exRow(item, k(activeDay,'glute',i))); }
  if (d.warmup && d.warmup.length) {
    h += `<div class="sec-title">Warm-up</div>`;
    d.warmup.forEach((item,i) => h += exRow(item, k(activeDay,'warmup',i)));
  }
  if (d.wodbox) h += `<div class="sec-title">Workout</div><div class="wod-box">${d.wodbox}</div>`;
  else h += `<div class="sec-title">Workout</div>`;
  d.workout.forEach((item,i) => h += exRow(item, k(activeDay,'workout',i)));
  if (d.cooldown && d.cooldown.length) {
    h += `<div class="sec-title">Cool-down</div>`;
    d.cooldown.forEach((item,i) => h += exRow(item, k(activeDay,'cooldown',i)));
  }
  const zone2Days = ["mon","wed","sat"]; // Zone 2 dropped from Tue/Fri 3 Sep 2026 — both already carry enough cardio (warm-up + hard session + cool-down); Thu is rest; Sun's row already is the day's Zone 2 volume
  if (zone2Days.includes(activeDay)) {
    h += `<div class="sec-title">Zone 2</div>`;
    h += zone2Row({n:"Zone 2 (AM)", hint:"Target 30min — after weights"}, k(activeDay,'z2am',0));
  }
  h += `<div class="sec-title">PM Rehab</div>`;
  PM_ITEMS.forEach((item,i) => h += exRow(item, k(activeDay,'pm',i)));
  if (zone2Days.includes(activeDay)) {
    h += zone2Row({n:"Zone 2 (PM catch-up)", hint:"If the AM slot didn't happen"}, k(activeDay,'z2pm',0));
  }
  h += `<div class="sec-title">Foot Pain</div>`;
  const pain = getPain(activeDay);
  h += `<div class="pain-row">` + [...Array(10).keys()].map(n=>n+1).map(n =>
    `<div class="pain-btn ${pain===n?'active':''}" data-pain="${n}">${n}</div>`).join('') + `</div>`;
  h += `<div class="sec-title">Steps (Apple Health, full day)</div>`;
  const steps = getSteps(activeDay);
  h += `<div class="note-input-wrap"><input class="note-input steps-input" type="number" inputmode="numeric"
    placeholder="e.g. 8442" value="${steps!==null?steps:''}"></div>`;
  h += `<button class="copy-btn" id="copyBtn">Copy Update</button>`;
  document.getElementById("main").innerHTML = h;

  document.querySelectorAll('.btn.yes, .btn.no').forEach(b => b.onclick = () => { setStatus(b.dataset.key, b.dataset.status); render(); });
  document.querySelectorAll('.z2-mode').forEach(b => b.onclick = () => { setZone2Mode(b.dataset.key, b.dataset.mode); render(); });
  document.querySelectorAll('[data-statuskey]').forEach(b => b.onclick = () => { setZone2Status(b.dataset.statuskey, b.dataset.zstatus); render(); });
  document.querySelectorAll('.note-toggle').forEach(b => b.onclick = () => {
    const nk = b.dataset.notekey;
    openNotes[nk] = !openNotes[nk];
    render();
    if (openNotes[nk]) {
      const inp = document.querySelector(`[data-noteinput="${nk}"]`);
      if (inp) inp.focus();
    }
  });
  document.querySelectorAll('.note-input').forEach(inp => inp.oninput = (e) => {
    const nk = e.target.dataset.noteinput;
    const kind = e.target.dataset.notekind;
    if (kind === 'zone2') { setZone2NoteOnly(nk, e.target.value); }
    else { setItemNote(nk, e.target.value); }
  });
  document.querySelectorAll('.pain-btn').forEach(b => b.onclick = () => { setPain(activeDay, parseInt(b.dataset.pain)); render(); });
  const stepsInput = document.querySelector('.steps-input');
  if (stepsInput) stepsInput.oninput = (e) => { setSteps(activeDay, e.target.value ? parseInt(e.target.value) : null); };
  document.getElementById('copyBtn').addEventListener('click', onCopyClick);
}

function setZone2NoteOnly(key, val) {
  const cur = getZone2(key); cur.note = val; state[key] = cur; saveState();
}

function render() { renderTabs(); renderDay(); }

function allKeysForDay(day) {
  const d = DAYS[day];
  const keys = [];
  PHYSIO.forEach((item,i) => keys.push([k(day,'physio',i), `AM Rehab: ${item.n}`, 'tick']));
  if (d.glute) d.glute.forEach((item,i) => keys.push([k(day,'glute',i), `Glute Activation: ${item.n}`, 'tick']));
  if (d.warmup) d.warmup.forEach((item,i) => keys.push([k(day,'warmup',i), `Warm-up: ${item.n}`, 'tick']));
  d.workout.forEach((item,i) => keys.push([k(day,'workout',i), `Workout: ${item.n}`, 'tick']));
  if (d.cooldown) d.cooldown.forEach((item,i) => keys.push([k(day,'cooldown',i), `Cool-down: ${item.n}`, 'tick']));
  keys.push([k(day,'z2am',0), `Zone 2 (AM)`, 'zone2']);
  PM_ITEMS.forEach((item,i) => keys.push([k(day,'pm',i), `PM Rehab: ${item.n}`, 'tick']));
  keys.push([k(day,'z2pm',0), `Zone 2 (PM catch-up)`, 'zone2']);
  return keys;
}

// FIX, 26 Sep 2026: the old version tracked ONLY whether a key had ever been copied (a plain
// list of keys), never what its value was at copy time. That meant amending anything already
// copied — ticking a box you'd left blank, fixing a mistake, adding a note — was permanently
// invisible to every future copy for that day, with no way to tell it had happened. This version
// stores a SIGNATURE (the actual status+note content) per key, and compares against that
// signature, not just presence, so a real change is always caught, even on an already-copied item.
// MIGRATION: old saved data only has `keys` (an array), no `sigs`. On first load under the old
// format, treat the CURRENT value of each already-copied key as its baseline signature, so nothing
// already legitimately copied floods back in at once — only genuine changes from here on surface.
function migrateCopiedDay(day, entry) {
  if (!entry) return { sigs:{}, pain:null, steps:null };
  if (entry.sigs) return entry; // already migrated
  const sigs = {};
  (entry.keys || []).forEach((key) => { sigs[key] = currentSignature(key); });
  return { sigs, pain: entry.pain ?? null, steps: entry.steps ?? null };
}
function currentSignature(key) {
  // Zone2 keys are always named "<day>_z2am_0" / "<day>_z2pm_0" (see allKeysForDay) — check the
  // key's own name, not the stored object's shape, since an untouched item's stored shape is
  // ambiguous (both get() and getZone2() default to harmless-looking empty objects).
  if (/_z2(am|pm)_0$/.test(key)) {
    const z = getZone2(key);
    return `${z.mode||''}|${z.note||''}`;
  }
  const st = get(key);
  return `${st.status||''}|${st.note||''}`;
}

function buildDelta(day) {
  const lines = [];
  const already = migrateCopiedDay(day, copied[day]);
  const newSigs = {};
  allKeysForDay(day).forEach(([key,label,type]) => {
    let sig, line;
    if (type === 'zone2') {
      const z = getZone2(key);
      if (!z.mode && !z.note) return;
      sig = `${z.mode||''}|${z.note||''}`;
      line = z.mode ? `${label}: ${z.mode.charAt(0).toUpperCase()+z.mode.slice(1)}` : `${label}:`;
      if (z.note) line += ` — note: ${z.note}`;
    } else {
      const st = get(key);
      if (!st.status && !st.note) return;
      sig = `${st.status||''}|${st.note||''}`;
      line = st.status ? `${label}: ${st.status==='yes'?'✓':'✗'}` : `${label}:`;
      if (st.note) line += ` — note: ${st.note}`;
    }
    if (already.sigs[key] === sig) return; // unchanged since last copy — genuinely nothing new here
    lines.push(line);
    newSigs[key] = sig;
  });
  const pain = getPain(day);
  const steps = getSteps(day);
  let extra = [];
  if (pain !== null && pain !== already.pain) extra.push(`Foot Pain: ${pain}/10`);
  if (steps !== null && steps !== already.steps) extra.push(`Steps (Apple Health): ${steps}`);
  const text = [...lines, ...extra].join('\n');
  return { text, newSigs, pain, steps, already };
}

async function onCopyClick() {
  const { text, newSigs, pain, steps, already } = buildDelta(activeDay);
  const btn = document.getElementById("copyBtn");
  if (!text) {
    btn.textContent = "Nothing new to copy"; btn.classList.add("nonew");
    setTimeout(() => { btn.textContent="Copy Update"; btn.classList.remove("nonew"); }, 1500);
    return;
  }
  const full = `${DAYS[activeDay].full}\n${text}`;
  try { await navigator.clipboard.writeText(full); }
  catch(e) { const ta=document.createElement('textarea'); ta.value=full; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  copied[activeDay] = { sigs: { ...already.sigs, ...newSigs }, pain: pain, steps: steps };
  saveCopied();
  btn.textContent = "Copied ✓"; btn.classList.add("copied");
  setTimeout(() => { btn.textContent="Copy Update"; btn.classList.remove("copied"); }, 2000);
}

loadState(); render();
</script>
</body>
